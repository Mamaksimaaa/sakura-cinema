<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050408">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Sakura Anime — Аниме онлайн</title>
  <link rel="icon" type="image/png" href="assets/logo-dark.png">
  <link rel="stylesheet" href="css/anilibria.css">
</head>
<body>

<!-- Particle canvas -->
<canvas id="particleCanvas"></canvas>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- ══════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════ -->
<div id="app">

  <!-- ── Top Header ───────────────────────────────────────── -->
  <header class="ani-header">

    <div class="ani-header-left">
      <!-- Back to Sakura Cinema -->
      <a class="back-btn" href="index.html" title="Назад в Sakura Cinema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Назад
      </a>

      <!-- Brand -->
      <a class="ani-brand" href="anilibria.html">
        <div class="ani-brand-icon">
          <img src="assets/logo-dark.png" alt="Sakura Cinema" class="ani-brand-logo">
        </div>
        <div>
          <div class="ani-brand-name">Sakura Anime</div>
          <div class="ani-brand-sub">桜アニメ</div>
        </div>
      </a>
    </div>

    <!-- Search -->
    <div class="ani-search-wrap">
      <form class="ani-search-form" id="aniSearchForm" autocomplete="off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="aniSearchInput"
          class="ani-search-input"
          placeholder="Поиск аниме..."
          spellcheck="false"
        >
        <button type="button" class="ani-search-clear" id="aniSearchClear" aria-label="Очистить">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- Right controls -->
    <div class="ani-header-right">
      <div class="ani-view-toggle">
        <button class="view-btn active" id="viewGrid" title="Сетка" aria-label="Вид сетка">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
        <button class="view-btn" id="viewList" title="Список" aria-label="Вид список">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

  </header>

  <!-- ── Hero Slider ───────────────────────────────────────── -->
  <section class="ani-hero" id="aniHero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient"></div>

    <div class="hero-content">
      <div class="hero-badges" id="heroBadges"></div>
      <h1 class="hero-title" id="heroTitle">Загрузка...</h1>
      <div class="hero-title-en" id="heroTitleEn"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-genres" id="heroGenres"></div>
      <div class="hero-actions">
        <button class="hero-play-btn" id="heroPlayBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Смотреть
        </button>
        <button class="hero-info-btn" id="heroInfoBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Подробнее
        </button>
      </div>
    </div>

    <!-- Arrow nav -->
    <button class="hero-prev" id="heroPrev" aria-label="Предыдущее">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="hero-next" id="heroNext" aria-label="Следующее">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- ── Genre filter bar ──────────────────────────────────── -->
  <div class="ani-content" style="padding-bottom:0;padding-top:20px">
    <div class="genre-filter-bar" id="genreFilterBar">
      <button class="gf-pill active" data-all>Все</button>
      <!-- Dynamic genre pills injected here by JS -->
    </div>
  </div>

  <!-- ── Main layout (sidebar + content) ──────────────────── -->
  <div class="ani-main">

    <!-- Sidebar -->
    <aside class="ani-sidebar">

      <div class="sidebar-section">
        <div class="sidebar-label">Навигация</div>
        <ul class="sidebar-nav">
          <li>
            <button class="sidebar-nav-item active" id="navLatest">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              Новинки
            </button>
          </li>
          <li>
            <button class="sidebar-nav-item" id="navOngoing">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              Онгоинги
            </button>
          </li>
        </ul>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Жанры</div>
        <div class="genre-pills" id="sidebarGenres">
          <!-- Dynamic genres injected by JS -->
          <div style="padding:12px;font-size:12px;color:#475569">Загрузка жанров...</div>
        </div>
      </div>

    </aside>

    <!-- Content -->
    <main class="ani-content">

      <!-- Section header -->
      <div class="section-header">
        <div>
          <div class="section-title">
            <img class="title-logo" src="assets/logo-dark.png" alt="Sakura Cinema">
            <span id="sectionMainTitle">Новинки аниме</span>
          </div>
          <div class="section-subtitle" id="sectionSubtitle">Последние вышедшие серии</div>
        </div>
      </div>

      <!-- Cards grid -->
      <div class="cards-grid" id="cardsGrid">
        <!-- Dynamic content by JS -->
      </div>

      <!-- Load more -->
      <div class="load-more-wrap">
        <button class="load-more-btn" id="loadMoreBtn" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Загрузить ещё
        </button>
      </div>

    </main>
  </div>

</div><!-- /#app -->


<!-- PLAYER MODAL -->
<div class="player-modal-backdrop" id="playerBackdrop">
  <div class="player-modal">

    <!-- Шапка -->
    <div class="player-modal-header">
      <button class="player-close-btn" id="playerCloseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Закрыть
      </button>
      <div class="player-modal-title" id="playerModalTitle">Просмотр</div>
      <!-- Навигация по сериям -->
      <div class="player-ep-nav">
        <button class="ep-nav-btn" id="epPrevBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          Пред.
        </button>
        <span class="ep-counter" id="epCounter">— / —</span>
        <button class="ep-nav-btn" id="epNextBtn">
          След.
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <!-- Качество -->
      <div class="player-quality-wrap">
        <span class="quality-label">Качество:</span>
        <button class="quality-btn active" data-quality="720" id="q720">720p</button>
        <button class="quality-btn" data-quality="1080" id="q1080">1080p</button>
        <button class="quality-btn" data-quality="480" id="q480">480p</button>
      </div>
    </div>

    <!-- Тело: видео + правая панель -->
    <div class="player-body">

      <!-- Видео -->
      <div class="player-video-section">
        <video
          id="animeVideoPlayer"
          controls
          playsinline
          crossorigin="anonymous"
          style="width:100%;height:100%;background:#000;display:block;"
        ></video>
        <!-- Спиннер -->
        <div class="player-spinner" id="playerSpinner"><div class="spinner-ring"></div></div>
      </div>

      <!-- Правая панель: инфо + серии -->
      <div class="player-right-panel">

        <div class="player-info-panel">
          <div class="detail-poster-wrap">
            <img class="detail-poster" id="detailPoster" src="" alt="" loading="lazy">
          </div>
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-title-en" id="detailTitleEn"></div>
          <div class="detail-meta-row" id="detailMeta"></div>
          <div class="detail-genres" id="detailGenres"></div>
          <div class="detail-desc-label">Описание</div>
          <div class="detail-desc" id="detailDesc"></div>
          <button class="detail-desc-toggle" id="detailDescToggle">Читать ещё</button>
          <div class="detail-stats">
            <div class="detail-stat">
              <span class="detail-stat-val" id="statWatching">—</span>
              <div class="detail-stat-lbl">Смотрят</div>
            </div>
            <div class="detail-stat">
              <span class="detail-stat-val" id="statFavs">—</span>
              <div class="detail-stat-lbl">В избранном</div>
            </div>
          </div>
        </div>

        <div class="player-episodes-panel">
          <div class="episodes-header">
            <div class="episodes-title">📺 Серии</div>
            <div class="episodes-count" id="episodesCount">...</div>
          </div>
          <div class="episodes-list" id="episodesList"></div>
        </div>

      </div><!-- /.player-right-panel -->
    </div><!-- /.player-body -->
  </div><!-- /.player-modal -->
</div><!-- /.player-modal-backdrop -->


<!-- Scripts -->
<script src="js/hls.min.js"></script>
<script src="js/anilibria.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>

</body>
</html>
