<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background aura / glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#9d4edd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0" />
    </radialGradient>
    
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb" />
      <stop offset="60%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#e01e5a" />
    </linearGradient>

    <!-- Eye gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="60%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>

    <!-- Skin tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2" />
      <stop offset="100%" stop-color="#ffe3dc" />
    </linearGradient>

    <!-- Ribbon gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="60" cy="60" r="56" fill="url(#auraGlow)" />

  <!-- Back Hair (Twin Tails) -->
  <path d="M 28 50 C 10 60, 8 95, 24 105 C 32 95, 30 75, 38 60 Z" fill="url(#hairGrad)" />
  <path d="M 92 50 C 110 60, 112 95, 96 105 C 88 95, 90 75, 82 60 Z" fill="url(#hairGrad)" />

  <!-- Twin Tail Ribbons -->
  <path d="M 28 52 C 22 48, 20 54, 25 58 C 30 60, 32 54, 28 52 Z" fill="url(#ribbonGrad)" />
  <path d="M 92 52 C 98 48, 100 54, 95 58 C 90 60, 88 54, 92 52 Z" fill="url(#ribbonGrad)" />

  <!-- Head / Face -->
  <circle cx="60" cy="62" r="32" fill="url(#skinGrad)" />

  <!-- Cute Blush Cheeks -->
  <ellipse cx="44" cy="71" rx="6" ry="3.5" fill="#ff7597" opacity="0.45" />
  <ellipse cx="76" cy="71" rx="6" ry="3.5" fill="#ff7597" opacity="0.45" />

  <!-- Anime Eyes -->
  <!-- Left Eye -->
  <g class="eye-left">
    <ellipse cx="46" cy="62" rx="6.5" ry="9" fill="url(#eyeGrad)" />
    <!-- Highlights / Sparkles -->
    <circle cx="44.5" cy="58.5" r="2.8" fill="#ffffff" />
    <circle cx="48" cy="66" r="1.5" fill="#ffffff" opacity="0.8" />
    <!-- Eyelash -->
    <path d="M 38 56 Q 46 51 54 56" stroke="#2b153b" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g class="eye-right">
    <ellipse cx="74" cy="62" rx="6.5" ry="9" fill="url(#eyeGrad)" />
    <!-- Highlights / Sparkles -->
    <circle cx="72.5" cy="58.5" r="2.8" fill="#ffffff" />
    <circle cx="76" cy="66" r="1.5" fill="#ffffff" opacity="0.8" />
    <!-- Eyelash -->
    <path d="M 66 56 Q 74 51 82 56" stroke="#2b153b" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sweet Smile -->
  <path d="M 56 75 Q 60 78 64 75" stroke="#e01e5a" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Front Hair / Bangs -->
  <path d="M 28 50 C 35 25, 85 25, 92 50 C 85 45, 82 55, 76 46 C 70 56, 62 48, 56 50 C 48 46, 42 54, 38 48 C 34 55, 30 48, 28 50 Z" fill="url(#hairGrad)" />

  <!-- Cherry Blossom Hair Pin -->
  <g transform="translate(74, 34) scale(0.65)">
    <!-- 5 Petals -->
    <circle cx="10" cy="5" r="4.5" fill="#ffffff" />
    <circle cx="15" cy="9" r="4.5" fill="#ffffff" />
    <circle cx="13" cy="15" r="4.5" fill="#ffffff" />
    <circle cx="7" cy="15" r="4.5" fill="#ffffff" />
    <circle cx="5" cy="9" r="4.5" fill="#ffffff" />
    <circle cx="10" cy="10.5" r="3" fill="#ffd166" />
  </g>

  <!-- Little Headphone / Cinema Ribbon Accent -->
  <path d="M 40 33 Q 60 25 80 33" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>
